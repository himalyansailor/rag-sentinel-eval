[project]
name = "rag-sentinel-eval"
version = "0.1.0"
description = "CI/CD quality gates and regression tracking for RAG pipelines, judged by open-source LLMs."
authors = [{ name = "himalyansailor" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = ["rag", "llm", "evaluation", "ragas", "ci", "ollama", "vllm", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
    "httpx>=0.27,<1",
    "tenacity>=8.3",
    "numpy>=1.26",
    "langchain-core>=0.3,<2",
    "langchain-text-splitters>=0.3,<2",
    "langchain-chroma>=0.2,<2",
    "langchain-ollama>=0.2,<2",
    "chromadb>=0.5",
    "typer>=0.12",
    "streamlit>=1.50",
    "pandas>=2.2",
    "altair>=5.3",
]

[project.urls]
Homepage = "https://github.com/himalyansailor/rag-sentinel-eval"
Documentation = "https://github.com/himalyansailor/rag-sentinel-eval/tree/main/docs"
Issues = "https://github.com/himalyansailor/rag-sentinel-eval/issues"

[project.scripts]
rag-sentinel = "rag_sentinel.cli:app"

[tool.poetry]
packages = [{ include = "rag_sentinel", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
respx = ">=0.21"
mypy = ">=1.10"
ruff = ">=0.5"
pandas-stubs = ">=2.2"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "PTH", "ASYNC", "PL", "C4", "RET"]
ignore = [
    "PLR0913", # many keyword-only args are fine for constructors / CLI commands
    "PLR2004", # magic values are fine in tests and thresholds
    "B008",    # typer uses function calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311"]
# Typer commands declare every CLI option as a parameter; UI/report renderers branch per state.
"src/rag_sentinel/cli.py" = ["PLR0915", "PLR0917", "PLR0912"]
"src/rag_sentinel/app.py" = ["PLR0915", "PLR0912"]
"src/rag_sentinel/report.py" = ["PLR0912"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "langchain_chroma.*", "langchain_ollama.*", "altair.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["rag_sentinel"]
omit = ["src/rag_sentinel/app.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
